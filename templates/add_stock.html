{% load static%}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Add Stock | TradeSync</title>
        <link rel="stylesheet" href="{% static 'add_stock.css' %}">

    </head>
    <body>
        <h1>Add New Stocks to Your Portfolio</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Add Stock</button>
        </form>
        <p><a href="{% url 'portfolio' %}">⬅️ Back to Portfolio</a></p>
    </body>
</html>
