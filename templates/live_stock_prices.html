{% load static %}
<!-- Include Bootstrap & Select2 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet">

<div class="container mt-5">
    <h4 class="mb-3">📈 Live Stock Prices</h4>

    <!-- Stock Selection Form -->
    <form id="stockForm">
        <select id="stockSelect" name="symbols" multiple="multiple" class="form-control">
            {% for stock in stock_list %}
                <option value="{{ stock.symbol }}">{{ stock.name }} ({{ stock.symbol }})</option>
            {% endfor %}
        </select>
        <button type="button" id="resetSelection" class="btn btn-secondary mt-2">Reset Selection</button>
    </form>

    <!-- Display Stock Data -->
    <table class="table table-hover table-bordered text-center mt-4">
        <thead class="table-dark">
            <tr>
                <th>SYMBOL</th>
                <th>NAME</th>
                <th>CURRENT PRICE</th>
                <th>OPEN</th>
                <th>CLOSE</th>
                <th>HIGH</th>
                <th>LOW</th>
                <th>VOLUME</th>
                <th>CHANGE</th>
            </tr>
        </thead>
        <tbody id="stockTable">
            {% for stock in stocks %}
            <tr class="stock-info" data-symbol="{{ stock.symbol }}">
                <td><strong>{{ stock.symbol }}</strong></td>
                <td>{{ stock.name }}</td>
                <td><strong>{{ stock.price }}</strong></td>
                <td>{{ stock.open }}</td>
                <td>{{ stock.close }}</td>
                <td>{{ stock.high }}</td>
                <td>{{ stock.low }}</td>
                <td>{{ stock.volume }}</td>
                <td class="{% if stock.change < 0 %}text-danger{% else %}text-success{% endif %}">{{ stock.change }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<div>

<!-- Include jQuery, Bootstrap & Select2 JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>

<script>
    $(document).ready(function() {
        // Initialize Select2 Multi-Select
        $('#stockSelect').select2({
            placeholder: "Choose stocks...",
            allowClear: true,
            width: '100%',
            //theme: "bootstrap-5",
        });

        // Filter Stock Table Dynamically
        $('#stockSelect').on('change', function () {
            let selectedSymbols = $(this).val() || [];
            
            if (selectedSymbols.length === 0) {
                $(".stock-info").show();  // Show all stocks if nothing is selected
            } else {
                $(".stock-info").each(function () {
                    let symbol = $(this).data("symbol");
                    $(this).toggle(selectedSymbols.includes(symbol));
                });
            }
        });

        // Reset Selection & Show All Stocks
        $('#resetSelection').on('click', function () {
            $('#stockSelect').val(null).trigger('change');  // Clear selection
            $(".stock-info").show();  // Show all stocks
        });
    });
</script>
