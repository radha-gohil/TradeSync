{% extends "dashboard.html" %}  <!-- Extend your main dashboard template -->

{% block content %}
<div class="news-container">
    <h2>Latest Market News</h2>
    
    <div class="news-grid">
        {% for article in news %}
        <div class="news-card">
            <img src="{{ article.image }}" alt="News Image">
            <h3>{{ article.title }}</h3>
            <p>{{ article.description|default:"No description available." }}</p>
            <a href="{{ article.url }}" target="_blank">Read More</a>
            <span class="news-source">{{ article.source }}</span>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    .news-container {
        max-width: 1000px;
        margin: auto;
        padding: 20px;
    }

    .news-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
    }

    .news-card {
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .news-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 5px;
    }

    .news-card h3 {
        font-size: 18px;
        margin: 10px 0;
    }

    .news-card p {
        font-size: 14px;
        color: #555;
    }

    .news-card a {
        display: inline-block;
        margin-top: 10px;
        padding: 8px 12px;
        background: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }

    .news-card a:hover {
        background: #0056b3;
    }

    .news-source {
        display: block;
        margin-top: 5px;
        font-size: 12px;
        color: gray;
    }
</style>
{% endblock %}
