{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile | TradeSync</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <section class="container">
        <div class="form-container">
            <h1 class="opacity">Update Profile</h1>

            {% if messages %}
                <div>
                    {% for message in messages %}
                        <p style="color: {% if message.tags == 'success' %}green{% else %}red{% endif %};">
                            {{ message }}
                        </p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="opacity">Update</button>
            </form>

            <div class="register-forget opacity">
                <a href="{% url 'dashboard' %}">⬅️ Back to Dashboard</a>
            </div>
        </div>
    </section>
</body>
</html>
